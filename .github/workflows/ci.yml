name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Run tests with coverage
        run: pytest --cov=image_encryption_system --cov-report=term-missing --cov-fail-under=80

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Auditing the declared requirements needs only the tool, not the project.
      - name: Install audit tooling
        run: pip install pip-audit

      # A vault is only as trustworthy as the crypto library under it, so a
      # known-vulnerable dependency should fail the build rather than warn.
      #
      # Audits the declared requirements rather than the installed environment.
      # The environment also contains this project's own editable install, which
      # is not published to PyPI, so under --strict pip-audit treated "could not
      # be audited" as a failure: the job had been red on every run since it was
      # added, which meant the dependency audit gave no signal at all.
      # (--skip-editable does not help - a skip is itself fatal under --strict.)
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict --desc -r requirements.txt
