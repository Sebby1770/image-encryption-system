name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts run.py

      - name: Check formatting
        run: ruff format --check src tests scripts run.py

      - name: Type check
        run: mypy

      # Unit, regression, and property tests. The e2e browser test skips here
      # (Playwright is not installed) and runs in its own job below.
      - name: Run tests with coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest --cov=image_encryption_system --cov-report=term-missing --cov-fail-under=85

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and Playwright
        run: |
          pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: pytest -m e2e tests/e2e -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: pip install pip-audit

      # A vault is only as trustworthy as the crypto library under it, so a
      # known-vulnerable dependency should fail the build rather than warn.
      # Audit the resolved runtime requirements: with --strict, auditing the
      # installed environment fails on this package itself (it is not on PyPI).
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict --desc -r requirements.txt
