[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-encryption-system"
version = "2.3.0"
description = "Authenticated AES-256-GCM image vault with RSA wrapping, capability links, and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sebastian Forbes" }]
dependencies = [
  "cryptography>=42.0.0",
  "Flask>=3.0.0",
  "Pillow>=10.0.0",
  "PyJWT>=2.8.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100.0",
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]
e2e = ["playwright>=1.45.0"]

[project.scripts]
ies = "image_encryption_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_encryption_system = [
  "templates/*.html",
  "static/*.svg",
  "static/css/*.css",
  "static/js/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["e2e: drives a real browser against a live server (needs Playwright + Chromium)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
